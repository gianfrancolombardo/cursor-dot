<!DOCTYPE html>
<html lang="es" data-theme="minimal">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Dot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="tip" id="tip" hidden>
        <div class="tip-head">
          <div class="tip-project" id="tip-project"></div>
          <div class="tip-age" id="tip-age"></div>
        </div>
        <div class="tip-prompt" id="tip-prompt"></div>
      </div>
      <div class="signal" id="signal" data-count="0">
        <div class="grip" aria-hidden="true" title="Mover"></div>
        <div class="sessions" id="sessions" aria-label="Chat sessions"></div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
